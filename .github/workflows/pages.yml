name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp build version
        env:
          BUILD_ID: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          build = os.environ["BUILD_ID"]

          for filename in ("index.html", "sw.js"):
              path = Path(filename)
              content = path.read_text(encoding="utf-8")
              if "__BUILD_ID__" not in content:
                  raise SystemExit(f"Missing __BUILD_ID__ placeholder in {filename}")
              path.write_text(content.replace("__BUILD_ID__", build), encoding="utf-8")

          Path("version.json").write_text(
              json.dumps({"build": build}) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
